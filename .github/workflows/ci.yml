name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-soundness:
    name: verify-soundness (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 / x86_64
          - arch: amd64
            runner: ubuntu-24.04
          # arm64 / aarch64 (native runner, no QEMU emulation)
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | bash -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report toolchain and platform
        run: |
          uname -m
          cat lean-toolchain
          lake --version

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .lake
            ~/.elan
          key: lake-${{ matrix.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-${{ hashFiles('MGQL/**/*.lean', 'MGQL.lean') }}
          restore-keys: |
            lake-${{ matrix.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean') }}-
            lake-${{ matrix.arch }}-

      - name: Run soundness verification
        run: |
          chmod +x verify-soundness.sh
          ./verify-soundness.sh | tee verify-output.log

      - name: Assert ALL CHECKS PASSED
        run: |
          if grep -q "ALL CHECKS PASSED" verify-output.log; then
            echo "verify-soundness.sh reported ALL CHECKS PASSED on ${{ matrix.arch }}"
          else
            echo "::error::verify-soundness.sh did not report ALL CHECKS PASSED on ${{ matrix.arch }}"
            exit 1
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output-${{ matrix.arch }}
          path: verify-output.log
          if-no-files-found: warn
